events {}
http {
	map $http_upgrade $connection_upgrade
{
	default upgrade;
	'' close;
}
server
{


	listen 8025 default_server;
	listen [::]:8025 default_server;

	location /
	{
		proxy_pass http://127.0.0.1:8001;
		proxy_set_header Host $host;
	}

	location ~ ^/api/v1/(connect|log-stream)/(.+)
	{
		proxy_pass http://127.0.0.1:8001;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
	}

	location ~ ^/api/v1/edit/
	{
		proxy_pass http://127.0.0.1:8001;
		client_max_body_size 1G;
	}

	location ~ ^/api/v1/(connect|log-stream)/(.+)
	{
		proxy_pass http://127.0.0.1:8001;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
	}


	location ~ ^/internal/
	{
		return 403;
	}
	location ~ ^/coder/(?<port>\d+)(?<rest>/.*)?$
	{
		# 1) Rewrite the request path to include <port> as the first segment
		#    E.g. /9001/another/path -> /9001/another/path
		#    (so that upstream sees /9001/... in the path)
		rewrite ^/coder/(?<port>\d+)(?<rest>/.*)?$ /coder/$port$rest break;

		# 2) Proxy to http://127.0.0.1:<port>, which will append
		#    the rewritten path (/9001/anything/here) to the upstream URL
		proxy_pass http://127.0.0.1:$port;

		# Enable WebSocket proxying
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";

		# (Optional) Preserve Host header if your upstream apps need it
		# proxy_set_header Host $host;
		add_header 'Access-Control-Allow-Origin' '*' always;
		add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
		add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
		add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

		# Handle preflight requests
		if ($request_method = OPTIONS)
		{
			add_header 'Access-Control-Max-Age' 1728000;
			add_header 'Content-Type' 'text/plain; charset=utf-8';
			add_header 'Content-Length' 0;
			return 204;
		}
	}
	location /coder-manager/
	{
		proxy_pass http://127.0.0.1:5025/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		# (Optional) Preserve Host header if your upstream needs it
		# proxy_set_header Host $host;
	}


}
}